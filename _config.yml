title: AppliedSO3's blog
description: My very nice blog
author: "AppliedSO3"
email: "xuanzhang2002@gmail.com"

theme: minima

repository: Xuanyiyiren/xuanyiyiren.github.io

# Minima social links
github_username: Xuanyiyiren
# linkedin_username: jsanz
rss: rss

# Minima: show excerpts in the frontpage
show_excerpts: true

minima:
  date_format: "%Y-%m-%d"

# Minima: custom header links
header_pages:
  - _pages/frontpage.md
  - _pages/about.md
  - _pages/archive.md

include:
    - _pages

exclude: 
    - .gitignore
    - docker-compose.yml
    - Gemfile
    - Gemfile.lock
    - LICENSE
    - README.md
    - vendor
